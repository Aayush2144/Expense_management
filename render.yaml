services:
  # 1. FastAPI REST Backend Service (Hosts the database API on Render)
  - type: web
    name: expense-management
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run_app.py
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: test

  # 2. Next.js 14+ 3D Spatial Frontend Service
  - type: web
    name: expense-vault-ui
    env: node
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_API_URL
        value: https://expense-management-0ik6.onrender.com
