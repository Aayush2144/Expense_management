services:
  # All-in-one unified service (Backend + Streamlit frontend in a single free Web Service)
  - type: web
    name: expense-management
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run_app.py
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: expense_manager
